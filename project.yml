# Projektdatei wird aus dieser Beschreibung erzeugt, nicht eingecheckt:
#
#   brew install xcodegen
#   xcodegen generate
#
# So bleibt das Repo frei von Merge-Konflikten in der .xcodeproj.

name: GEGO
options:
  bundleIdPrefix: org.gut-einern
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  GEGO:
    type: application
    platform: iOS
    sources:
      - path: GEGO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.gut-einern.gego
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GE-GO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: GE-GO erkennt Gegenstände in deiner Umgebung und setzt Fundpunkte darauf. Ohne Kamera geht das nicht.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
